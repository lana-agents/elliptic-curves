automation:
  methods:
    - method: "agent"
      models: ["claude-opus-4-8", "claude-opus-5", "claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: >-
    Néron–Ogg–Shafarevich (good ⇒ unramified) is proved for a valuation subring A ⊆ L that is an
    adically complete DVR, with inertia A.inertiaSubgroup K, rather than for a local field with
    inertia inside Gal(Kᵘʳ/K). Torsion, Tate-module, Weil-pairing and determinant results are stated
    over an algebraically closed field F with (2 : F) ≠ 0 and the relevant integer invertible (the
    case ℓ = 3 in characteristic 2 is treated separately); off F̄ the principality input of the Weil
    pairing is a hypothesis (hprin). Galois representations are given as continuous matrix
    representations G → GL₂(ℤ_ℓ) for a group G acting compatibly.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    All results are machine-checked by the Lean kernel; `#print axioms` of every main result listed
    under status (checked on a build of this revision) gives only propext, Classical.choice and
    Quot.sound, and `git grep` finds sorry only in prose, with no axiom declaration or
    native_decide.

alignment:
  namespace: "WeierstrassCurve"
  statements:
    - source: "Silverman, AEC, Proposition VII.7.1 / Theorem VII.7.1 (good reduction ⇒ unramified)"
      lean: "WeierstrassCurve.Affine.neronOggShafarevich_galoisRep_eq_one"
      module: "EllipticCurves/Reduction/NeronOggShafarevich.lean"
      status: "proved"
      note: "Only the good ⇒ unramified direction, over an adically complete DVR."
    - source: "Silverman, AEC, Proposition VII.2.2 (kernel of reduction is the formal group)"
      lean: "WeierstrassCurve.E₁AddEquiv"
      module: "EllipticCurves/Reduction/KernelFormalGroupIso.lean"
      status: "proved"
    - source: "Silverman, AEC, Corollary III.6.4 (structure of E[n])"
      lean: "WeierstrassCurve.Affine.card_torsion_eq_sq, WeierstrassCurve.Affine.nonempty_torsion_addEquiv"
      module: "EllipticCurves/Torsion/StructureGeneral.lean"
