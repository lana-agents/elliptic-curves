    torsion structure, Tate modules and ℓ-adic and mod-n Galois representations, the Weil pairing
    and the determinant of ρ_ℓ. Open: the converse of Néron–Ogg–Shafarevich and its local-field
    form, the semi-stable reduction theorem, and the image of ρ_ℓ. Results are proved under the
    hypotheses in their signatures (typically F algebraically closed and (2 : F) ≠ 0).
