version: "v0.4"

project:
  name: "elliptic-curves"
  description: >-
    A Lean 4 / Mathlib formalization project on the arithmetic of elliptic curves, following
    Silverman's The Arithmetic of Elliptic Curves. It proves the good ⇒ unramified direction of the
    Néron–Ogg–Shafarevich criterion (ℓ-adic and mod ℓ) over an adically complete DVR, the kernel of
    reduction as the formal group, injectivity of reduction on prime-to-p torsion and the
    reduction-type trichotomy with its j-invariant criteria; the Weierstrass formal group over an
    arbitrary commutative ring with its logarithm; the torsion structure #E[n] = n² and
    E[n] ≃ (ℤ/nℤ)² over an algebraically closed field; the Tate module T_ℓE ≅ ℤ_ℓ² and the continuous
    representation ρ_ℓ : G → GL₂(ℤ_ℓ); the Weil pairing with all properties of Silverman III.8.1;
    and det ρ_ℓ = χ_ℓ. The two headline targets, semi-stable reduction and the full
    Néron–Ogg–Shafarevich criterion, are not finished.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "The Arithmetic of Elliptic Curves"
    authors: ["Joseph H. Silverman"]
    id: "doi:10.1007/978-0-387-09494-6"
    type: "book"
    location: "Graduate Texts in Mathematics 106, 2nd ed.; Ch. III §6-8, Ch. IV, Ch. VII §2-7"
    relationship: "formalizes"
    note: >-
      Torsion structure, the Weil pairing (III.8.1), the formal group (Ch. IV), reduction
      (VII.2.2, reduction types) and the good ⇒ unramified half of Néron–Ogg–Shafarevich (VII.7.1).
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/lana-agents/tempered-fundamental-groups"
    relationship: "other"
    note: >-
      Used by: tempered-fundamental-groups pins bebec3f and uses finite_torsion_of_charZero and
      finite_torsion_of_not_dvd_charP; lana-agents/iut depends on this repository only through it.

